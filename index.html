<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevSpawn</title>
<meta name="description" content="DevSpawn makes small, sharp mobile games. Home of OVERLOAD.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  --void:#060a1c; --panel:#0c1330; --line:#1f2b57;
  --cyan:#3ff6ff; --mag:#ff3fd2; --gold:#ffc94a;
  --text:#e6eeff; --muted:#9aa8cc;
  --display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --body:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--void);
  background-image:
    radial-gradient(60rem 40rem at 10% -10%, rgba(110,40,190,.22), transparent 60%),
    radial-gradient(50rem 40rem at 110% 20%, rgba(20,110,200,.18), transparent 60%);
  background-attachment:fixed;
  color:var(--text); font-family:var(--body); font-size:19px; line-height:1.55;
  padding:0 16px;
}
a{color:var(--cyan)}
a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:64px 0 72px;display:flex;flex-direction:column;gap:40px}
.brand{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,60px);letter-spacing:.06em;margin:0;color:#fff}
.tag{color:var(--muted);margin:6px 0 0;font-size:20px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.orb{width:120px;height:120px;flex:0 0 auto;border-radius:50%;position:relative;
     box-shadow:0 0 0 7px var(--cyan),0 0 34px 8px rgba(63,246,255,.45)}
.orb::after{content:"";position:absolute;inset:36px;border-radius:50%;background:#fff;box-shadow:0 0 22px rgba(255,255,255,.8)}
.info{flex:1 1 260px;min-width:0}
h2{font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,40px);margin:0;color:var(--cyan);text-shadow:0 0 20px rgba(63,246,255,.45)}
.words{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:15px;margin:6px 0 12px}
.words .r{color:var(--cyan)} .words .s{color:var(--mag)}
.info p{margin:0 0 12px}
.links{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}
footer{color:var(--muted);font-size:15px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">DEVSPAWN</p>
    <p class="tag">Small, sharp mobile games.</p>
  </header>

  <div class="game">
    <div class="orb" role="img" aria-label="Overload icon"></div>
    <div class="info">
      <h2>OVERLOAD</h2>
      <p class="words">HOLD. <span class="r">RELEASE.</span> <span class="s">SURVIVE.</span></p>
      <p>A one-thumb arcade survival game for Android. Hold to charge, release to blast, and survive the swarm.</p>
      <div class="links">
        <a href="overload-privacy.html">Privacy policy</a>
      </div>
    </div>
  </div>

  <footer>Contact: <a href="mailto:devarthsambare123@gmail.com">devarthsambare123@gmail.com</a><br>&copy; 2026 DevSpawn</footer>
</div>
</body>
</html>
